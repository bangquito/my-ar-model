<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebAR MindAR SLAM</title>
    <!-- Include MindAR A-Frame library -->
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <!-- 
      The scene initializes and requests camera permissions instantly on load.
      'uiLoading: no' and 'uiScanning: no' hide native engine overlays.
    -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1; uiLoading: no; uiScanning: no;" embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- The 3D content attached to your primary image target index -->
      
        <a-box position="0 0 0" scale="0.5 0.5 0.5" color="blue"></a-box>
      
      
    </a-scene>

  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ELK AR - Hybrid SLAM</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

  <script>
    AFRAME.registerComponent('hybrid-image-slam', {
      init: function () {
        const sceneEl = this.el;
        const stableAnchor = document.querySelector("#stableAnchor");
        const elk = document.querySelector("#elk");
        let modelAnchored = false;

        sceneEl.addEventListener('xrimagefound', (e) => {
          if (modelAnchored) return; // Anchor only once to let SLAM take over
          
          const pose = e.detail.pose;
          
          // Apply real-world SLAM coordinates from the detected image
          stableAnchor.object3D.position.copy(pose.transform.position);
          stableAnchor.object3D.quaternion.copy(pose.transform.orientation);
          stableAnchor.setAttribute('visible', 'true');
          
          // Trigger the animation
          elk.setAttribute("animation-mixer", "clip: *; loop: repeat");
          modelAnchored = true;
          console.log("✅ IMAGE FOUND: SLAM ANCHOR SET");
        });

        // Note: No "xrimage lost" hiding logic is needed. 
        // Standard WebXR SLAM will keep the object perfectly positioned in the environment.
      }
    });
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>

<body>
  <a-scene
    webxr="optionalFeatures: image-tracking; imageTrackingEnabled: true;"
    hybrid-image-slam
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
  >

    <!-- The camera now moves freely in world-space driven by device SLAM -->
    <a-camera position="0 0 0"></a-camera>

    <a-entity light="type: ambient; intensity: 1.5;"></a-entity>
    <a-entity light="type: directional; intensity: 1;" position="1 2 1"></a-entity>

    <!-- The object stays exactly where it was spawned -->
    <a-entity id="stableAnchor" visible="false">
      <a-entity
        id="elk"
        gltf-model="url(./elkfin.glb)"
        position="-0.8 0 0"
        rotation="90 0 0"
        scale="0.5 0.5 0.5"
        visible="true">
      </a-entity>
    </a-entity>

  </a-scene>
</body>
</html>

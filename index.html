<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ELK AR — Hybrid Image-to-SLAM</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // Same smoothing component as before — used during the IMAGE phase
    // while confidence is being established.
    AFRAME.registerComponent("smooth-target-follow", {
      schema: {
        target: { type: "selector" },
        positionSmoothing: { default: 0.12 },
        rotationSmoothing: { default: 0.10 }
      },

      init() {
        this.following = false;
        this.hasPose = false;
        this.targetPosition = new THREE.Vector3();
        this.targetQuaternion = new THREE.Quaternion();
        this.targetScale = new THREE.Vector3();
        this.parentQuaternion = new THREE.Quaternion();

        this.startFollowing = (snap = false) => {
          this.following = true;
          if (snap) this.hasPose = false;
        };

        this.stopFollowing = () => {
          this.following = false;
        };
      },

      tick(time, delta) {
        if (!this.following || !this.data.target) return;

        const source = this.data.target.object3D;
        const destination = this.el.object3D;

        source.updateWorldMatrix(true, false);
        source.getWorldPosition(this.targetPosition);
        source.getWorldQuaternion(this.targetQuaternion);
        source.getWorldScale(this.targetScale);

        if (destination.parent) {
          destination.parent.updateWorldMatrix(true, false);
          destination.parent.worldToLocal(this.targetPosition);
          destination.parent.getWorldQuaternion(this.parentQuaternion);
          this.parentQuaternion.invert();
          this.targetQuaternion.premultiply(this.parentQuaternion);
        }

        if (!this.hasPose) {
          destination.position.copy(this.targetPosition);
          destination.quaternion.copy(this.targetQuaternion);
          destination.scale.copy(this.targetScale);
          this.hasPose = true;
          return;
        }

        const frameRatio = Math.max(delta, 16.67) / 16.67;
        const positionAlpha = 1 - Math.pow(1 - this.data.positionSmoothing, frameRatio);
        const rotationAlpha = 1 - Math.pow(1 - this.data.rotationSmoothing, frameRatio);

        destination.position.lerp(this.targetPosition, positionAlpha);
        destination.quaternion.slerp(this.targetQuaternion, rotationAlpha);
        destination.scale.lerp(this.targetScale, positionAlpha);
      }
    });

    // NEW: drives worldRig's rotation from the device gyroscope once locked,
    // so the anchored elk stays visually stable in space as the phone moves.
    AFRAME.registerComponent("gyro-world-lock", {
      schema: {
        target: { type: "selector" } // the worldRig entity
      },

      init() {
        this.active = false;
        this.baselineDeviceQuat = new THREE.Quaternion();
        this.baselineRigQuat = new THREE.Quaternion();
        this.baselineRigPos = new THREE.Vector3();
        this.currentDeviceQuat = new THREE.Quaternion();
        this.workQuat = new THREE.Quaternion();
        this.workPos = new THREE.Vector3();

        this.screenOrientation = window.orientation || 0;
        window.addEventListener("orientationchange", () => {
          this.screenOrientation = window.orientation || 0;
        });

        this._onDeviceOrientation = (event) => {
          if (event.alpha === null) return;
          this.currentDeviceQuat.copy(
            deviceOrientationToQuaternion(event.alpha, event.beta, event.gamma, this.screenOrientation)
          );
        };

        this.enable = () => {
          window.addEventListener("deviceorientation", this._onDeviceOrientation);
        };
      },

      // Call when the elk transitions into the world-locked / SLAM phase.
      // Captures the rig's current pose + the device's current orientation
      // as the reference frame for all future gyro compensation.
      engage(worldPosition, worldQuaternion) {
        this.baselineRigPos.copy(worldPosition);
        this.baselineRigQuat.copy(worldQuaternion);
        this.baselineDeviceQuat.copy(this.currentDeviceQuat);
        this.active = true;
      },

      disengage() {
        this.active = false;
      },

      tick() {
        if (!this.active || !this.data.target) return;

        const rig = this.data.target.object3D;

        // How much the phone has rotated since we locked.
        this.workQuat.copy(this.currentDeviceQuat).multiply(this.baselineDeviceQuat.clone().invert());
        const deviceDelta = this.workQuat.clone().invert();

        // Counter-rotate the rig so the object appears fixed in world space
        // as the camera (phone) rotates around it.
        rig.quaternion.copy(deviceDelta).multiply(this.baselineRigQuat);

        this.workPos.copy(this.baselineRigPos).applyQuaternion(deviceDelta);
        rig.position.copy(this.workPos);
      }
    });

    // Standard device-orientation -> quaternion conversion (w3c DeviceOrientation
    // spec / commonly used three.js recipe), including screen-orientation compensation.
    function deviceOrientationToQuaternion(alphaDeg, betaDeg, gammaDeg, screenOrientationDeg) {
      const DEG2RAD = Math.PI / 180;
      const alpha = alphaDeg * DEG2RAD;
      const beta = betaDeg * DEG2RAD;
      const gamma = gammaDeg * DEG2RAD;
      const orient = (screenOrientationDeg || 0) * DEG2RAD;

      const euler = new THREE.Euler(beta, alpha, -gamma, "YXZ");
      const quat = new THREE.Quaternion().setFromEuler(euler);

      const minusHalfPiAroundX = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
      quat.multiply(minusHalfPiAroundX);

      const screenAdjust = new THREE.Quaternion(0, 0, -Math.sin(orient / 2), Math.cos(orient / 2));
      quat.multiply(screenAdjust);

      return quat;
    }
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body { position: fixed; }
    a-scene { position: absolute; width: 100%; height: 100%; }
    .a-enter-vr { display: none !important; }

    #motionGate {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.85);
      color: #fff;
      font-family: sans-serif;
      text-align: center;
    }
    #motionGate button {
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #fff;
      color: #000;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <!-- iOS requires a user gesture before granting motion sensor access. -->
  <div id="motionGate">
    <div>
      <p>Tap to enable motion tracking</p>
      <button id="motionGateBtn">Enable</button>
    </div>
  </div>

  <a-scene
    id="scene"
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: true;
      uiScanning: true;
      uiError: true;
      filterMinCF: 0.001;
      filterBeta: 50;
      warmupTolerance: 5;
      missTolerance: 15;
    "
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity light="type: ambient; intensity: 1.5;"></a-entity>
    <a-entity light="type: directional; intensity: 1;" position="1 2 1"></a-entity>

    <!-- Raw MindAR target pose (IMAGE phase source of truth) -->
    <a-entity id="elkTarget" mindar-image-target="targetIndex: 0"></a-entity>

    <!-- World rig: this is what the gyro drives during the LOCKED/SLAM phase -->
    <a-entity id="worldRig" gyro-world-lock="target: #worldRig">

      <!-- Smoothed pose used during IMAGE phase, before lock engages -->
      <a-entity
        id="stableAnchor"
        visible="false"
        smooth-target-follow="target: #elkTarget; positionSmoothing: 0.12; rotationSmoothing: 0.10;"
      >
        <a-entity
          id="elk"
          gltf-model="url(./elkt.glb)"
          position="-0.8 0 0"
          rotation="90 0 0"
          scale="0.5 0.5 0.5"
          visible="true">
        </a-entity>
      </a-entity>

    </a-entity>

  </a-scene>

  <script>
    const scene = document.querySelector("#scene");
    const target = document.querySelector("#elkTarget");
    const worldRig = document.querySelector("#worldRig");
    const stableAnchor = document.querySelector("#stableAnchor");
    const elk = document.querySelector("#elk");

    let modelLoaded = false;
    let targetIsTracked = false;
    let animationStarted = false;
    let lostTimer = null;
    let lockTimer = null;

    // ---- Hybrid state machine ----
    // SEARCHING : no lock yet, waiting for image target
    // LOCKING   : image found, building confidence before handing off to gyro
    // LOCKED    : world-anchored via gyro; image reacquisition just refines it
    let phase = "SEARCHING";

    const LOST_GRACE_MS = 1000;      // brief image dropout tolerance during LOCKING
    const LOCK_ENGAGE_MS = 1200;     // continuous tracking required before SLAM handoff
    const RELOCK_ON_REACQUIRE = true; // refresh gyro baseline whenever image is seen again

    function getSmoothFollow() {
      return stableAnchor.components["smooth-target-follow"];
    }

    function getGyroLock() {
      return worldRig.components["gyro-world-lock"];
    }

    function startAnimation() {
      if (!modelLoaded || animationStarted) return;
      elk.setAttribute("animation-mixer", {
        clip: "*",
        loop: "repeat",
        repetitions: Infinity,
        timeScale: 1
      });
      animationStarted = true;
      console.log("▶ ELK ANIMATION STARTED");
    }

    function resetAnimation() {
      if (!animationStarted) return;
      elk.removeAttribute("animation-mixer");
      animationStarted = false;
      console.log("⏹ ELK ANIMATION RESET");
    }

    function activateModel(snapToTarget = false) {
      if (!modelLoaded || !targetIsTracked) return;

      clearTimeout(lostTimer);
      lostTimer = null;

      const follower = getSmoothFollow();
      if (follower) follower.startFollowing(snapToTarget);

      stableAnchor.setAttribute("visible", true);
      startAnimation();
    }

    // Hands off tracking from the image target to the gyro-driven world rig.
    function engageWorldLock() {
      const anchorObj = stableAnchor.object3D;
      anchorObj.updateWorldMatrix(true, false);

      const worldPos = new THREE.Vector3();
      const worldQuat = new THREE.Quaternion();
      anchorObj.getWorldPosition(worldPos);
      anchorObj.getWorldQuaternion(worldQuat);

      // Stop image-driven following — the rig takes over from here.
      const follower = getSmoothFollow();
      if (follower) follower.stopFollowing();

      // Collapse stableAnchor's own transform to identity, since worldRig
      // will now carry the captured pose.
      stableAnchor.object3D.position.set(0, 0, 0);
      stableAnchor.object3D.quaternion.identity();

      const gyroLock = getGyroLock();
      gyroLock.engage(worldPos, worldQuat);

      phase = "LOCKED";
      console.log("🔒 WORLD LOCK ENGAGED (image → gyro handoff)");
    }

    scene.addEventListener("loaded", () => {
      console.log("✅ A-FRAME SCENE READY");
    });

    elk.addEventListener("model-loaded", () => {
      console.log("✅ ELK GLB LOADED");
      modelLoaded = true;

      const object = elk.getObject3D("mesh");
      if (!object) {
        console.error("❌ NO ELK MESH FOUND");
        return;
      }

      object.traverse((node) => {
        if (node.isMesh || node.isSkinnedMesh) node.frustumCulled = false;
        if (node.material) {
          const materials = Array.isArray(node.material) ? node.material : [node.material];
          materials.forEach((material) => {
            material.side = THREE.DoubleSide;
            material.needsUpdate = true;
          });
        }
      });

      console.log("✅ ELK MESH READY");
      if (targetIsTracked) activateModel(true);
    });

    elk.addEventListener("model-error", (event) => {
      console.error("❌ ELK GLB LOAD ERROR:", event);
    });

    target.addEventListener("targetFound", () => {
      console.log("✅ TARGET FOUND");
      const wasHidden = stableAnchor.getAttribute("visible") === false;
      targetIsTracked = true;

      clearTimeout(lostTimer);
      lostTimer = null;

      if (phase === "LOCKED") {
        // Already world-locked — use this reacquisition purely to correct drift.
        if (RELOCK_ON_REACQUIRE) {
          // Let one tick of smooth-follow-free pose settle, then re-engage.
          activateModel(false);
          clearTimeout(lockTimer);
          lockTimer = setTimeout(engageWorldLock, 50);
        }
        return;
      }

      // SEARCHING or LOCKING: normal image-driven activation.
      activateModel(wasHidden);
      phase = "LOCKING";

      clearTimeout(lockTimer);
      lockTimer = setTimeout(() => {
        if (targetIsTracked) engageWorldLock();
      }, LOCK_ENGAGE_MS);
    });

    target.addEventListener("targetLost", () => {
      console.log("⚠️ TARGET TEMPORARILY LOST");
      targetIsTracked = false;

      clearTimeout(lockTimer);
      lockTimer = null;

      if (phase === "LOCKED") {
        // The whole point of the hybrid mode: don't hide or reset — the
        // gyro rig keeps the elk anchored in place.
        console.log("↪ MARKER LOST — HOLDING GYRO WORLD LOCK");
        return;
      }

      // Still in SEARCHING/LOCKING: fall back to the original grace-period behavior.
      const follower = getSmoothFollow();
      if (follower) follower.stopFollowing();

      clearTimeout(lostTimer);
      lostTimer = setTimeout(() => {
        if (targetIsTracked) return;
        stableAnchor.setAttribute("visible", false);
        resetAnimation();
        phase = "SEARCHING";
        console.log("⏹ TARGET LOST - ELK HIDDEN (never reached lock)");
      }, LOST_GRACE_MS);
    });

    // ---- Motion permission gate (required by iOS Safari) ----
    const motionGate = document.getElementById("motionGate");
    const motionGateBtn = document.getElementById("motionGateBtn");

    async function requestMotionAccess() {
      const gyroLock = getGyroLock();
      try {
        if (typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function") {
          const result = await DeviceOrientationEvent.requestPermission();
          if (result !== "granted") {
            console.warn("⚠️ Motion permission denied — hybrid lock will not engage.");
            motionGate.remove();
            return;
          }
        }
        gyroLock.enable();
        console.log("✅ MOTION TRACKING ENABLED");
      } catch (err) {
        console.error("❌ MOTION PERMISSION ERROR:", err);
      } finally {
        motionGate.remove();
      }
    }

    motionGateBtn.addEventListener("click", requestMotionAccess, { once: true });
  </script>
</body>
</html>
